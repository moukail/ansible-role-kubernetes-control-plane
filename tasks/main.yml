---
- name: Allow Kubernetes API server traffic
  ansible.posix.firewalld:
    zone: public
    port: 6443/tcp
    permanent: true
    immediate: true
    state: enabled

- name: Initialize Kubernetes cluster
  ansible.builtin.command: kubeadm init --apiserver-advertise-address={{ ansible_host }} --pod-network-cidr={{ pod_network_cidr }}
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory for {{ ansible_user }} user
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Copy kubeconfig to {{ ansible_user }} user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Install Calico pod network
  become: false
  ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml

- name: Generate join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command

- name: Set join command
  set_fact:
    join_command: "{{ join_command.stdout_lines[0] }}"
